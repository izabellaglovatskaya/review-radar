# Install once: uv run pre-commit install
# Run on everything: uv run pre-commit run --all-files
# Revs are pinned to commit SHAs (tags can be moved); update with: uv run pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
