# CI: lint, tests, browser tests and a secret scan over the full git history.
# No secrets are used, and nothing calls the Anthropic API or Telegram: the test jobs run in demo
# mode with blank credentials, and live tests are deselected by default (pytest addopts).
# Actions are pinned to commit SHAs (tags can be moved). Check locally with
# `uv run pytest tests/test_ci_workflow.py` and
# `uvx --from actionlint-py==1.7.12.24 actionlint .github/workflows/ci.yml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.8"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy src

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEW_RADAR_MODE: demo
      ANTHROPIC_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.8"
      - name: Install dependencies
        run: uv sync --locked
      - name: Pytest (no live or browser tests)
        run: |
          uv run pytest

  # A separate job: it needs Chrome (preinstalled on GitHub's Ubuntu image) and the `browser`
  # dependency group (Playwright, locked in uv.lock). A missing browser fails the job instead
  # of skipping.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REVIEW_RADAR_MODE: demo
      ANTHROPIC_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      REVIEW_RADAR_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.8"
      - name: Install dependencies
        run: uv sync --locked --group browser
      - name: Browser tests (headless Chrome)
        run: uv run --locked --group browser pytest -m browser --no-cov

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, not only the last commit
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          rm "$archive"
      - name: Scan every commit (values redacted)
        run: ./gitleaks git --redact --no-banner --verbose .
