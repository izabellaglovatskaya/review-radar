[project]
name = "review-radar"
version = "0.1.0"
description = "Turns a CSV of customer reviews into a daily Telegram summary and a static sentiment dashboard (fictional data)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
review-radar = "review_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_radar"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to check things in pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["review_radar"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
